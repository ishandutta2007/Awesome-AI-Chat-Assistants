<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(30px) translateX(-20px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
    }
    @keyframes pulseOrb {
      0% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.45; }
      100% { transform: scale(1); opacity: 0.25; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .orb-1 {
      animation: pulseOrb 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 9s ease-in-out infinite alternate;
      transform-origin: 1000px 260px;
    }
    .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 8s ease-in-out infinite; }
    .particle-3 { animation: floatParticle1 5s ease-in-out infinite 1s; }
    .particle-4 { animation: floatParticle2 7s ease-in-out infinite 2s; }
    .dynamic-flow {
      stroke-dasharray: 20, 15;
      animation: flowLine 14s linear infinite;
    }
    .radar-circle {
      animation: radarSpin 24s linear infinite;
      transform-origin: 600px 180px;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle High-tech Grid Pattern -->
  <g opacity="0.12">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200" stroke="#38bdf8" stroke-width="1"/>
    <path d="M120,0 V360 M240,0 V360 M360,0 V360 M480,0 V360 M600,0 V360 M720,0 V360 M840,0 V360 M960,0 V360 M1080,0 V360" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Animated Ambient Light Orbs (Background layer) -->
  <circle class="orb-1" cx="200" cy="110" r="140" fill="url(#glowGrad1)"/>
  <circle class="orb-2" cx="1020" cy="240" r="160" fill="url(#glowGrad2)"/>

  <!-- Dynamic Animated Tech Circuit / Constellation Lines (Behind text) -->
  <g class="dynamic-flow" opacity="0.35" fill="none" stroke="#38bdf8" stroke-width="1.5">
    <path d="M 60,300 Q 300,120 600,200 T 1140,80"/>
    <path d="M 80,60 Q 400,260 700,140 T 1120,310"/>
  </g>

  <!-- Dynamic Floating Node Indicators -->
  <g class="particle-1">
    <circle cx="160" cy="220" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="160" cy="220" r="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  </g>
  <g class="particle-2">
    <circle cx="1040" cy="110" r="6" fill="#c084fc" filter="url(#softGlow)"/>
    <circle cx="1040" cy="110" r="18" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
  </g>
  <g class="particle-3">
    <circle cx="940" cy="280" r="4" fill="#38bdf8"/>
  </g>
  <g class="particle-4">
    <circle cx="280" cy="70" r="4.5" fill="#f43f5e"/>
  </g>

  <!-- Subtle Central Radar Geometry -->
  <g class="radar-circle" opacity="0.15">
    <circle cx="600" cy="180" r="150" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6,8"/>
    <circle cx="600" cy="180" r="120" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <line x1="450" y1="180" x2="750" y2="180" stroke="#818cf8" stroke-width="1"/>
    <line x1="600" y1="30" x2="600" y2="330" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- FOREGROUND: Content Elements with crisp readability -->
  
  <!-- Pill Badges in Foreground -->
  <g transform="translate(425, 48)">
    <rect width="350" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <text class="tag-text" x="35" y="21" fill="#94a3b8">CURATED ECOSYSTEM  •  OCTOBER 2026</text>
  </g>

  <!-- Primary Headline -->
  <text class="title-text" x="600" y="145" text-anchor="middle" font-size="46" fill="url(#textGrad)" filter="url(#softGlow)">Awesome AI Chat Assistants</text>
  <text class="title-text" x="600" y="145" text-anchor="middle" font-size="46" fill="url(#textGrad)">Awesome AI Chat Assistants</text>

  <!-- Subtitle and Description -->
  <text class="subtitle-text" x="600" y="195" text-anchor="middle" font-size="20" fill="#e2e8f0">The Definitive Index of Frontier Conversational AI &amp; Self-Hosted WebUIs</text>
  
  <text class="subtitle-text" x="600" y="235" text-anchor="middle" font-size="14.5" fill="#94a3b8">
    Proprietary Frontier SaaS  •  Local LLM Frontends  •  Multi-Agent Chatbots  •  RAG &amp; Tool Calling
  </text>

  <!-- Interactive / High-tech Pill Indicators -->
  <g transform="translate(600, 285)">
    <!-- Pill 1: SaaS Leaders -->
    <g transform="translate(-250, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" opacity="0.9"/>
      <text class="tag-text" x="0" y="5" text-anchor="middle" fill="#60a5fa">⚡ Frontier SaaS</text>
    </g>
    <!-- Pill 2: Open Source Frontends -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" opacity="0.9"/>
      <text class="tag-text" x="0" y="5" text-anchor="middle" fill="#c084fc">🔓 Open-Source WebUIs</text>
    </g>
    <!-- Pill 3: Self-Hosted & Local -->
    <g transform="translate(250, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.9"/>
      <text class="tag-text" x="0" y="5" text-anchor="middle" fill="#34d399">🛡️ 100% Private &amp; Local</text>
    </g>
  </g>

  <!-- Outer Border Stroke -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
