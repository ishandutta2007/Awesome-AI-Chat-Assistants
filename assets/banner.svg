<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0c16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b92b27"/><stop offset="100%" stop-color="#1565c0"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="30"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatParticle1{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-25px) translateX(15px);opacity:.8}}@keyframes floatParticle2{0%{transform:translateY(0) translateX(0);opacity:.4}50%{transform:translateY(30px) translateX(-20px);opacity:.9}}@keyframes pulseOrb{0%{transform:scale(1);opacity:.25}50%{transform:scale(1.18);opacity:.45}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes radarSpin{0%{transform:rotate(0deg)}}.orb-1{animation:pulseOrb 7s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 9s ease-in-out infinite alternate;transform-origin:1000px 260px}.particle-1{animation:floatParticle1 6s ease-in-out infinite}.particle-2{animation:floatParticle2 8s ease-in-out infinite}.particle-3{animation:floatParticle1 5s ease-in-out infinite 1s}.particle-4{animation:floatParticle2 7s ease-in-out infinite 2s}.dynamic-flow{stroke-dasharray:20,15;animation:flowLine 14s linear infinite}.radar-circle{animation:radarSpin 24s linear infinite;transform-origin:600px 180px}.title-text{font-weight:800;letter-spacing:-1px}.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;letter-spacing:.5px}.tag-text{font-weight:600;font-size:13px}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g opacity=".12"><path stroke="#38bdf8" stroke-width="1" d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200"/><path stroke="#38bdf8" stroke-width="1" d="M120,0 V360 M240,0 V360 M360,0 V360 M480,0 V360 M600,0 V360 M720,0 V360 M840,0 V360 M960,0 V360 M1080,0 V360"/></g><circle cx="200" cy="110" r="140" fill="url(#glowGrad1)" class="orb-1"/><circle cx="1020" cy="240" r="160" fill="url(#glowGrad2)" class="orb-2"/><g fill="none" stroke="#38bdf8" stroke-width="1.5" class="dynamic-flow" opacity=".35"><path d="M 60,300 Q 300,120 600,200 T 1140,80"/><path d="M 80,60 Q 400,260 700,140 T 1120,310"/></g><g class="particle-1"><circle cx="160" cy="220" r="5" fill="#38bdf8" filter="url(#softGlow)"/><circle cx="160" cy="220" r="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".5"/></g><g class="particle-2"><circle cx="1040" cy="110" r="6" fill="#c084fc" filter="url(#softGlow)"/><circle cx="1040" cy="110" r="18" fill="none" stroke="#c084fc" stroke-width="1" opacity=".5"/></g><g class="particle-3"><circle cx="940" cy="280" r="4" fill="#38bdf8"/></g><g class="particle-4"><circle cx="280" cy="70" r="4.5" fill="#f43f5e"/></g><g class="radar-circle" opacity=".15"><circle cx="600" cy="180" r="150" fill="none" stroke="#818cf8" stroke-dasharray="6 8" stroke-width="1"/><circle cx="600" cy="180" r="120" fill="none" stroke="#38bdf8" stroke-width="1"/><line x1="450" x2="750" y1="180" y2="180" stroke="#818cf8" stroke-width="1"/><line x1="600" x2="600" y1="30" y2="330" stroke="#818cf8" stroke-width="1"/></g><g transform="translate(425, 48)"><rect width="350" height="32" fill="#1e293b" fill-opacity=".85" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="16"/><circle cx="20" cy="16" r="5" fill="#10b981"/><text x="35" y="21" fill="#94a3b8" class="tag-text">CURATED ECOSYSTEM • OCTOBER 2026</text></g><text x="600" y="145" fill="url(#textGrad)" class="title-text" filter="url(#softGlow)" font-size="46" text-anchor="middle">Awesome AI Chat Assistants</text><text x="600" y="145" fill="url(#textGrad)" class="title-text" font-size="46" text-anchor="middle">Awesome AI Chat Assistants</text><text x="600" y="195" fill="#e2e8f0" class="subtitle-text" font-size="20" text-anchor="middle">The Definitive Index of Frontier Conversational AI &amp; Self-Hosted WebUIs</text><text x="600" y="235" fill="#94a3b8" class="subtitle-text" font-size="14.5" text-anchor="middle">Proprietary Frontier SaaS • Local LLM Frontends • Multi-Agent Chatbots • RAG &amp; Tool Calling</text><g><g transform="translate(600, 285) translate(-250, 0)"><rect width="170" height="28" x="-85" y="-14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" opacity=".9" rx="14"/><text x="0" y="5" fill="#60a5fa" class="tag-text" text-anchor="middle">⚡ Frontier SaaS</text></g><g transform="translate(600, 285) translate(0, 0)"><rect width="190" height="28" x="-95" y="-14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" opacity=".9" rx="14"/><text x="0" y="5" fill="#c084fc" class="tag-te